setup_script = """#!/usr/bin/env bash
set -euo pipefail

# Install Ruby dependencies
bundle install --jobs 4 --retry 3

# Install Node.js dependencies
npm install

# Database setup
bundle exec rails db:prepare 2>/dev/null || bundle exec rails db:create db:migrate
"""

[env]
DATABASE_URL = "postgres://postgres:password@localhost:5432/deckhand_test"
REDIS_URL = "redis://localhost:6379/0"
RAILS_ENV = "test"
OPENAI_ACCESS_TOKEN = "dummy-token"
GITHUB_APP_IDENTIFIER = "123456"
GITHUB_APP_KEY = "dummy-key"

[services.postgres]
image = "postgres:15-alpine"
env = { POSTGRES_USER = "postgres", POSTGRES_PASSWORD = "password", POSTGRES_DB = "deckhand_test" }
options = """
--health-cmd pg_isready
--health-interval 10s
--health-timeout 5s
--health-retries 5
"""

[services.redis]
image = "redis:7-alpine"
options = """
--health-cmd redis-cli ping
--health-interval 10s
--health-timeout 5s
--health-retries 5
"""
