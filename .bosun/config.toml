setup_script = """
#!/usr/bin/env bash
set -euo pipefail

# Install Ruby dependencies
bundle install --jobs 4 --retry 3

# Install Node dependencies
npm install

# Set up database
bundle exec rails db:prepare
"""

[env]
RAILS_ENV = "test"
DATABASE_URL = "postgres://postgres:password@localhost:5432/deckhand_test"
REDIS_URL = "redis://localhost:6379/0"

[services.postgres]
image = "postgres:15-alpine"
env = { POSTGRES_USER = "postgres", POSTGRES_PASSWORD = "password", POSTGRES_DB = "deckhand_test" }
options = """
--health-cmd pg_isready
--health-interval 10s
--health-timeout 5s
--health-retries 5
"""

[services.redis]
image = "redis/redis-stack:7.2-alpine"
options = """
--health-cmd redis-cli ping
--health-interval 10s
--health-timeout 5s
--health-retries 5
"""
